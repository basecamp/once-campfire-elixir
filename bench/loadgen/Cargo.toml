[package]
name = "loadgen"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the app workspace (bench/ tooling only).
[workspace]

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "sync", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
hdrhistogram = { version = "7", default-features = false }
serde_json = "1"
regex = "1"
# `loadgen gzip`: zlib-rs, the app's deflate backend, against miniz_oxide, flate2's default.
# `runtime_detection` gives zlib-rs the `std` its SIMD feature detection needs.
miniz_oxide = "0.9"
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }

[profile.release]
debug = false
